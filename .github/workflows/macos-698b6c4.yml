name: Build and smoke-test Gastrolab macOS verification installers
on:
  push:
    branches: [verification/macos-gastrolab-oficial]
    paths: ['.github/workflows/macos-698b6c4.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and unpack the signed Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/octet-stream' repos/IvanMunoz1000/gastrolab-updates/releases/assets/805054567 > installer.exe
          echo '3f57c6c6f63d36ca7c970b8044379a714442fab3060811647bb1e7192cee67cd  installer.exe' | shasum -a 256 -c -
          tool=$(command -v 7zz || command -v 7z || (brew install sevenzip >&2 && command -v 7zz))
          "$tool" x -y -owindows installer.exe >/dev/null
          "$tool" x -y -onative "$(find windows -name app-64.7z -print -quit)" resources/app.asar >/dev/null
          mkdir -p tools desktop
          cd tools
          npm install --no-audit --no-fund @electron/asar@4.0.1 electron-builder@26.18.0
          node --input-type=module <<'JS'
          import {extractFile,listPackage} from '@electron/asar';
          import {mkdirSync,writeFileSync} from 'node:fs';
          import {dirname} from 'node:path';
          const asar='../native/resources/app.asar';
          for(const entry of listPackage(asar)){
            const name=entry.replace(/^\//,'');
            if(!/^(?:electron|dist)\/[\w./-]+\.[\w-]+$/.test(name)||name.split('/').includes('..'))continue;
            const target='../desktop/'+name;
            mkdirSync(dirname(target),{recursive:true});writeFileSync(target,extractFile(asar,name));
          }
          JS
          cd ../desktop
          echo '{"name":"gastrolab-pos","version":"2.3.15","type":"module","main":"electron/main.js","description":"Gastrolab POS","author":"Gastrolab"}' >package.json
          cp dist/pwa-512x512.png icon.png
          cat > build.yml <<'YAML'
          appId: com.gastrolab.pos
          productName: Gastrolab
          electronVersion: 45.3.4
          directories:
            output: output
          files:
            - dist/**/*
            - electron/**/*
            - package.json
          mac:
            icon: icon.png
            identity: '-'
          artifactName: GASTROLAB-2.3.15-${arch}.${ext}
          YAML
          ../tools/node_modules/.bin/electron-builder --config build.yml --mac dmg --${{ matrix.arch }} --publish never
      - name: Verify disk image and native launch
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find desktop/output -name '*.dmg' -print -quit)
          hdiutil verify "$dmg"
          mountpoint="$RUNNER_TEMP/Gastrolab-image"
          mkdir -p "$mountpoint"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$dmg"
          app="$mountpoint/Gastrolab.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/Gastrolab" --user-data-dir="$RUNNER_TEMP/gastrolab-profile" --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 >"$RUNNER_TEMP/gastrolab.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const wait=ms=>new Promise(r=>setTimeout(r,ms));let page;
          for(let i=0;i<60&&!page;i++){await wait(500);try{page=(await(await fetch('http://127.0.0.1:9222/json/list')).json()).find(p=>p.url.startsWith('gastrolab://localhost'))}catch{}}
          assert.ok(page);const ws=new WebSocket(page.webSocketDebuggerUrl);await new Promise(r=>ws.onopen=r);
          let seq=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(pending.has(m.id)){pending.get(m.id)(m);pending.delete(m.id)}};
          async function command(method,params={}){const id=++seq,p=new Promise(r=>pending.set(id,r));ws.send(JSON.stringify({id,method,params}));const m=await p;assert.ok(!m.error);return m.result}
          async function ready(){for(let i=0;i<40;i++){const m=await command('Runtime.evaluate',{expression:"document.getElementById('root')?.innerText?.trim().length>10",returnByValue:true});if(m.result.value)return;await wait(500)}throw Error('Interface unavailable')}
          await ready();await command('Network.enable');await command('Network.emulateNetworkConditions',{offline:true,latency:0,downloadThroughput:0,uploadThroughput:0});await command('Page.reload');await wait(1000);await ready();ws.close();
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: desktop/output/*.dmg
          retention-days: 1
