name: Publish GASTROLAB 2.3.12 verified installers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v2-3-12.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      WIN_ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-7b34-81f5-b78e-ecf4d9963eb2/raw?se=2026-11-26T21%3A44%3A56Z&sp=r&sv=2026-06-06&sr=b&scid=529a1c0a-ea0c-5fbc-8621-7cadc603b5a0&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-26T15%3A05%3A27Z&ske=2026-11-27T15%3A05%3A27Z&sks=b&skv=2026-06-06&sig=UcXLeGxET7epEKSHGAS7W64W6OhpL4L2RNnL1ARaDM4%3D'
      ANDROID_ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-a4ac-81f5-9c0b-a4287abd7d54/raw?se=2026-11-26T21%3A44%3A47Z&sp=r&sv=2026-06-06&sr=b&scid=08484bd1-9f8e-58ba-8978-fc2c2774ea2f&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-26T09%3A39%3A04Z&ske=2026-11-27T09%3A39%3A04Z&sks=b&skv=2026-06-06&sig=Pu8ZdecjVSrBPdC5aSWg7D%2BnETrnaUD6zZWI2Xp4sSA%3D'
      MAC_ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-38ac-81f5-a5f0-5a860c926dd1/raw?se=2026-11-26T21%3A45%3A08Z&sp=r&sv=2026-06-06&sr=b&scid=a106ae6a-b4c1-55fc-9e07-85b8a0521c54&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-26T08%3A20%3A07Z&ske=2026-11-27T08%3A20%3A07Z&sks=b&skv=2026-06-06&sig=EzRJyXY9Bskqz/lnRiqadY2yjiOaoJfXljhqLRBzQHo%3D'
    steps:
      - name: Download exact main SHA f226104f artifacts and verify ZIP hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p win android mac release
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 900 --silent --show-error "$WIN_ARTIFACT_URL" -o windows.zip
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 180 --silent --show-error "$ANDROID_ARTIFACT_URL" -o android.zip
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 900 --silent --show-error "$MAC_ARTIFACT_URL" -o macos.zip
          echo 'b2a24490a915eba84b49ede3678e58ae2ed44ad02ca1846ed5ab18fcd19b819f  windows.zip' | sha256sum --check
          echo 'b33bc5f3435943cae2d137025f79ea05180bb0d25e82c922ca23b3baabf4a283  android.zip' | sha256sum --check
          echo '8a779a88d05cf13d9a9c4ad2dbd79b63d9f75b0210bf27348fe4d3e0b2fb1391  macos.zip' | sha256sum --check
          unzip -q windows.zip -d win
          unzip -q android.zip -d android
          unzip -q macos.zip -d mac
          test -s win/GASTROLAB-2.3.12-x64.exe
          test -s win/GASTROLAB-2.3.12-x64.exe.blockmap
          test -s win/latest.yml
          test -s android/GASTROLAB-2.3.12-Android.apk
          test -s mac/GASTROLAB-2.3.12-x64.dmg
          test -s mac/GASTROLAB-2.3.12-arm64.dmg
      - name: Verify Windows release manifest and version integrity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, base64, re
          exe=Path('win/GASTROLAB-2.3.12-x64.exe')
          data=Path('win/latest.yml').read_text()
          assert re.search(r'^version:\s*2\.3\.12\s*$',data,re.M)
          assert exe.name in data
          digest=base64.b64encode(hashlib.sha512(exe.read_bytes()).digest()).decode()
          sums=re.findall(r'^\s*sha512:\s*(\S+)\s*$',data,re.M)
          assert len(sums)>0 and all(v==digest for v in sums)
          print('GASTROLAB_2_3_12_WINDOWS_MANIFEST_VERIFIED')
          PY
          cp win/GASTROLAB-2.3.12-x64.exe win/GASTROLAB-2.3.12-x64.exe.blockmap win/latest.yml release/
          cp android/GASTROLAB-2.3.12-Android.apk release/
          cp mac/GASTROLAB-2.3.12-x64.dmg mac/GASTROLAB-2.3.12-arm64.dmg release/
          (cd release && sha256sum *.exe *.apk *.dmg > SHA256SUMS.txt)
      - name: Publish complete release after all three archives verified
        shell: bash
        run: |
          set -euo pipefail
          tag=v2.3.12
          repo="$GITHUB_REPOSITORY"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --repo "$repo" --json isDraft --jq '.isDraft')" = true || { echo "Cannot overwrite an existing public release"; exit 1; }
          else
            gh release create "$tag" --repo "$repo" --draft --title 'GASTROLAB POS 2.3.12' --notes 'Versión Windows 64 bits y Android firmada; macOS Intel/Apple Silicon sin firma ni notarización Apple (puede bloquearse por Gatekeeper). La web instalable PWA es la alternativa en iPhone/iPad: no se distribuye un IPA nativo. Incluye seis mesas por nuevo restaurante, reparaciones automáticas de mesas faltantes, historial de copias Excel por módulo y mantenimiento compacto. Borrar sistema exige archivo externo cifrado con retención y permisos IAM de Firebase; sigue inhabilitado hasta cumplir esos requisitos. El Excel no contiene cuentas de Firebase Authentication ni claves privadas SRI. Validación de facturación SRI real requiere firma del contribuyente.'
          fi
          gh release upload "$tag" release/* --repo "$repo" --clobber
          gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name' > actual.txt
          for f in GASTROLAB-2.3.12-x64.exe GASTROLAB-2.3.12-x64.exe.blockmap latest.yml GASTROLAB-2.3.12-Android.apk GASTROLAB-2.3.12-x64.dmg GASTROLAB-2.3.12-arm64.dmg SHA256SUMS.txt; do grep -Fxq "$f" actual.txt; done
          gh release edit "$tag" --repo "$repo" --draft=false --latest
          echo GASTROLAB_2_3_12_RELEASE_PUBLISHED
